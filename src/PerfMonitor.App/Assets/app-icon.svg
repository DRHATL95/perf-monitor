<?xml version="1.0" encoding="UTF-8"?>
<!--
  PerfMonitor brand mark — "Pill Cluster"
  Source of truth. Rasterize to multi-resolution app-icon.ico during build.
  Palette matches the glassmorphic theme (theme/glass.json).
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <radialGradient id="bg" cx="0.3" cy="0.3">
      <stop offset="0%"   stop-color="#1f2233"/>
      <stop offset="100%" stop-color="#0a0c18"/>
    </radialGradient>
  </defs>

  <!-- disc -->
  <circle cx="64" cy="64" r="60" fill="url(#bg)"
          stroke="rgba(255,255,255,0.15)" stroke-width="1.5"/>
  <circle cx="64" cy="64" r="56" fill="none"
          stroke="rgba(0,240,255,0.18)" stroke-width="0.8"/>

  <!-- 4 accent pills (CPU / RAM / GPU / Net) -->
  <rect x="28" y="34" width="32" height="12" rx="6" fill="#ff8a5a"/>
  <rect x="68" y="34" width="32" height="12" rx="6" fill="#5ad0ff"/>
  <rect x="28" y="54" width="32" height="12" rx="6" fill="#a58aff"/>
  <rect x="68" y="54" width="32" height="12" rx="6" fill="#5affaa"/>

  <!-- pulse bar -->
  <rect x="28" y="80" width="72" height="3" rx="1.5" fill="rgba(255,255,255,0.1)"/>
  <rect x="28" y="80" width="42" height="3" rx="1.5" fill="#00f0ff"/>
</svg>
