name: release

# Triggered by pushing a version tag (e.g. `git push origin v0.2.0`).
# Builds the app from that tag's commit, bundles the publish folder into a
# ZIP, computes a SHA256 checksum, and creates a GitHub Release with both
# attached. Release notes are auto-generated from commit titles since the
# previous tag.
on:
  push:
    tags:
      - 'v*'
  # Manual retrigger — pick an existing tag as the source ref in the UI
  # or via `gh workflow run release.yml --ref v0.1.0`. Handy if an earlier
  # release run failed, or for tags that were pushed before this workflow
  # existed.
  workflow_dispatch:

permissions:
  contents: write   # needed to create releases via GITHUB_TOKEN

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Fetch full history so auto-generated release notes can diff
          # against the previous tag.
          fetch-depth: 0

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Determine version
        id: version
        shell: pwsh
        run: |
          # GITHUB_REF is refs/tags/v0.1.0 -> strip to 0.1.0
          $tag = "${{ github.ref_name }}"
          $ver = $tag -replace '^v',''
          "tag=$tag"       | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "version=$ver"   | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          # Pre-release if the version contains a hyphen (e.g. 0.2.0-beta.1)
          $prerelease = if ($ver -match '-') { 'true' } else { 'false' }
          "prerelease=$prerelease" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Tag: $tag / Version: $ver / Pre-release: $prerelease"

      - name: Restore
        run: dotnet restore

      - name: Test
        run: dotnet test --configuration Release --verbosity minimal

      - name: Publish (multi-file self-contained)
        run: >
          dotnet publish src/PerfMonitor.App
          -c Release -r win-x64 --self-contained
          -p:Version=${{ steps.version.outputs.version }}
          -o publish

      - name: Build installer (Inno Setup)
        id: package
        shell: pwsh
        run: |
          $ver = "${{ steps.version.outputs.version }}"
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) { throw "Inno Setup not found at $iscc" }

          & $iscc "/DMyAppVersion=$ver" "scripts\installer.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup compile failed" }

          $installer = "PerfMonitor-v$ver-setup.exe"
          if (!(Test-Path $installer)) { throw "Expected $installer after compile" }

          $sha = (Get-FileHash $installer -Algorithm SHA256).Hash.ToLower()
          "$sha  $installer" | Out-File "$installer.sha256" -Encoding ascii
          "installer=$installer"         | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "sha256file=$installer.sha256" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "sha256=$sha"                  | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Built $installer ($((Get-Item $installer).Length / 1MB) MB), SHA256: $sha"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: PerfMonitor ${{ steps.version.outputs.tag }}
          tag_name: ${{ steps.version.outputs.tag }}
          prerelease: ${{ steps.version.outputs.prerelease }}
          generate_release_notes: true
          body: |
            **Install:** download `${{ steps.package.outputs.installer }}` and run it.
            Installs per-user to `%LOCALAPPDATA%\Programs\PerfMonitor`; no admin required.
            Self-contained — no .NET runtime install needed.

            > The installer isn't code-signed, so Windows SmartScreen will show a
            > "Windows protected your PC" dialog on first download. Click **More info**
            > then **Run anyway**. Signing is on the v0.2 roadmap.

            **Verify:** SHA256 `${{ steps.package.outputs.sha256 }}`

            **Requirements:** Windows 10 1903+ for per-process GPU tracking; Windows 11 recommended.
            Admin elevation required only for CPU/GPU temperatures.

            See `CHANGELOG` below for changes since the previous release.
          files: |
            ${{ steps.package.outputs.installer }}
            ${{ steps.package.outputs.sha256file }}
